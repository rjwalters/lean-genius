version: 2
# Org policy (rjwalters/.github repo-policy.json): Dependabot, weekly Monday
# 06:00 Pacific, 14-day cooldown on version updates (security updates are not
# delayed). Local exceptions: label tier:maintenance (no `dependencies` label
# exists here), submodules monthly without cooldown, risk-bearing npm deps ungrouped.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels: ["tier:maintenance"]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels: ["tier:maintenance"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        # Risk-bearing deps stay ungrouped so each bump is its own reviewable PR:
        # playwright (browser binary), better-sqlite3 (native, Node-version coupled),
        # drizzle-orm / drizzle-kit (D1 schema migrations).
        exclude-patterns: ["playwright", "better-sqlite3", "drizzle-orm", "drizzle-kit"]
        update-types: ["minor", "patch"]
    # Majors are deliberately ungrouped: one reviewable PR each.

  - package-ecosystem: "npm"
    directory: "/mcp-servers/aristotle"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels: ["tier:maintenance"]
    groups:
      aristotle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (the native rewrite) fails `tsc` on src/client.ts with new
      # implicit-any errors (#43727 merged manifest-only and was pinned back to 5.9
      # in the follow-up fix). Re-evaluate when the server is ported.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/Los_Angeles"
    # No cooldown here: the submodules are our own data mirrors, not third-party
    # releases, and cooldown support for gitsubmodule is not guaranteed.
    labels: ["tier:maintenance"]
    groups:
      submodules:
        patterns: ["*"]

# Not configured on purpose:
# - docker (proofs/Dockerfile): ubuntu:22.04 is pinned for Lean toolchain reproducibility.
# - cargo (proofs/data/knuth/tour-finder): never built here, no lockfile.
